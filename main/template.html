<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvester Hub - Master Dashboard</title>
    <style>
        /* HARVESTER COCKPIT UI - OFFLINE OPTIMIZED
           Calibrated for BTS7960 & L293D Tool Stack
        */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #2563eb;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f8fafc;
            --dim: #64748b;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand h1 {
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 900;
        }

        .brand span { font-size: 9px; color: var(--dim); font-weight: bold; text-transform: uppercase; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }
        .status-txt { font-size: 9px; font-weight: 900; color: #cbd5e1; }

        /* Video Feed Viewport */
        .viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid var(--card);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .viewport img { width: 100%; height: 100%; object-fit: contain; }

        #ai-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--success);
            color: #000;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 900;
            display: none;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
            z-index: 10;
        }

        /* Vision Mode Switching */
        .mode-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .btn-m {
            background: var(--card);
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .m-active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); 
        }

        /* Control Deck (Scrollable) */
        .deck {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .section-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #334155;
            border-radius: 28px;
            padding: 16px;
        }

        .section-card h2 {
            font-size: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dim);
            margin: 0 0 15px 0;
        }

        /* Control Grids */
        .climb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-climb {
            height: 85px;
            background: var(--primary);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 6px 0 #1e40af;
            transition: all 0.1s;
        }

        .btn-climb:active { 
            transform: translateY(4px); 
            box-shadow: 0 2px 0 #1e40af; 
            filter: brightness(1.1);
        }

        .btn-tool {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 20px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .btn-tool:active { background: #475569; transform: scale(0.96); }

        /* Fixed Bottom Actions */
        .bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-top: 10px;
        }

        .btn-heavy {
            height: 90px;
            border: none;
            border-radius: 28px;
            color: white;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .cutter-btn { background: #ea580c; border-bottom: 5px solid #9a3412; }
        .stop-btn { background: var(--danger); border-bottom: 5px solid #991b1b; }
        
        .on { background: #fb923c; border-bottom-width: 0; transform: translateY(5px); }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Harvester Hub</h1>
            <span>BTS7960 + L293D Stack</span>
        </div>
        <div class="status-badge">
            <div class="dot"></div>
            <span class="status-txt">LINK READY</span>
        </div>
    </header>

    <div class="viewport">
        <img id="main-feed" src="/video_feed">
        <div id="ai-label">AI SIGHT ACTIVE</div>
    </div>

    <div class="mode-row">
        <button onclick="setMode('OFF')" id="m-OFF" class="btn-m m-active">OFF</button>
        <button onclick="setMode('LIVE')" id="m-LIVE" class="btn-m">LIVE HD</button>
        <button onclick="setMode('AI')" id="m-AI" class="btn-m" style="color:var(--success)">AI DETECT</button>
    </div>

    <div class="deck">
        
        <!-- LOCOMOTION (RELAYED VIA PI TO ESP8266) -->
        <div class="section-card">
            <h2>Climbing Base (ESP8266 Bridge)</h2>
            <div class="climb-grid">
                <button class="btn-climb" 
                    onmousedown="api('esp/up')" onmouseup="api('esp/stop')"
                    ontouchstart="api('esp/up')" ontouchend="api('esp/stop')">ASCEND</button>
                <button class="btn-climb" 
                    onmousedown="api('esp/down')" onmouseup="api('esp/stop')"
                    ontouchstart="api('esp/down')" ontouchend="api('esp/stop')">DESCEND</button>
            </div>
        </div>

        <!-- HARVESTING TOOLS (DIRECT PI 5 GPIO) -->
        <div class="section-card">
            <h2 style="color:var(--accent)">Harvesting Tools (Pi 5 BTS7960)</h2>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div class="climb-grid">
                    <button class="btn-tool" onmousedown="api('motors/ARM_EXTEND')" onmouseup="api('motors/IDLE')"
                        ontouchstart="api('motors/ARM_EXTEND')" ontouchend="api('motors/IDLE')">EXTEND</button>
                    <button class="btn-tool" onmousedown="api('motors/ARM_RETRACT')" onmouseup="api('motors/IDLE')"
                        ontouchstart="api('motors/ARM_RETRACT')" ontouchend="api('motors/IDLE')">RETRACT</button>
                </div>
                <div class="climb-grid">
                    <button class="btn-tool" onmousedown="api('motors/TRACK_CW')" onmouseup="api('motors/IDLE')"
                        ontouchstart="api('motors/TRACK_CW')" ontouchend="api('motors/IDLE')">ROTATE CW</button>
                    <button class="btn-tool" onmousedown="api('motors/TRACK_CCW')" onmouseup="api('motors/IDLE')"
                        ontouchstart="api('motors/TRACK_CCW')" ontouchend="api('motors/IDLE')">ROTATE CCW</button>
                </div>
            </div>
        </div>

    </div>

    <div class="bottom-actions">
        <button id="cutter-btn" onclick="toggleCutter()" class="btn-heavy cutter-btn">Cutter</button>
        <button onclick="emergency()" class="btn-heavy stop-btn">Master Stop</button>
    </div>

    <script>
        let cutterState = false;

        // Command relay to server.py
        function api(path) {
            fetch('/api/' + path).catch(() => {
                // Silently handle network drops during high-current spikes
            });
        }

        // Mode Switching Logic for Pi Camera
        function setMode(mode) {
            // UI button updates
            document.querySelectorAll('.btn-m').forEach(b => b.classList.remove('m-active'));
            document.getElementById('m-' + mode).classList.add('m-active');
            
            // HUD Tag visibility
            document.getElementById('ai-label').style.display = (mode === 'AI') ? 'block' : 'none';
            
            // Force stream refresh to clear old frames
            const img = document.getElementById('main-feed');
            if (mode !== 'OFF') {
                img.src = "/video_feed?t=" + new Date().getTime();
            } else {
                img.src = "/video_feed"; // Trigger standby frame
            }
            
            api('mode/' + mode);
        }

        // Cutter Logic (L293D Toggle)
        function toggleCutter() {
            cutterState = !cutterState;
            const btn = document.getElementById('cutter-btn');
            btn.classList.toggle('on');
            btn.innerText = cutterState ? 'CUTTER ACTIVE' : 'CUTTER';
            api('motors/CUT_TOGGLE');
        }

        // Emergency Kill Switch - Stops all Pi motors and ESP motors
        function emergency() {
            api('esp/stop');
            api('motors/IDLE');
            document.body.style.opacity = "0.5";
            setTimeout(() => { location.reload(); }, 500);
        }
    </script>
</body>
</html>
